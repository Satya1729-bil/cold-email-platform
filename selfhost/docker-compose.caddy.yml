# Adds Caddy (HTTPS) in front of the app on the AWS server.
# Used by selfhost/deploy-ec2.sh together with the main docker-compose.yml.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
